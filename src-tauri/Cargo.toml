[package]
name = "tasknotes-timer"
version = "2.0.1"
description = "A floating timer widget for TaskNotes"
authors = ["Jane T"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tasknotes_timer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP client for talking to the TaskNotes API. No TLS features: the API is
# plain http on 127.0.0.1, so we avoid pulling in OpenSSL/native-tls.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
