name: Build Tauri PoC

on:
  workflow_dispatch:
  push:
    branches: [poc/tauri]
    paths:
      - 'tauri-poc/**'
      - '.github/workflows/tauri-poc.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri-poc/src-tauri -> target

      - name: Install frontend deps
        working-directory: tauri-poc
        run: npm install

      - name: Build Tauri app
        working-directory: tauri-poc
        run: npm run tauri build

      - name: Report bundle sizes
        shell: bash
        run: |
          echo "=== bundle output ==="
          find tauri-poc/src-tauri/target/release/bundle -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) \
            -exec ls -lh {} \; || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-poc-${{ matrix.platform }}
          path: |
            tauri-poc/src-tauri/target/release/bundle/dmg/*.dmg
            tauri-poc/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
