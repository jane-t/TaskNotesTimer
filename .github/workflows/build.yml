name: Build TaskNotes Timer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend deps
        run: npm install

      - name: Build Tauri app
        run: npm run tauri build

      - name: Report bundle sizes
        shell: bash
        run: |
          echo "=== bundle output ==="
          find src-tauri/target/release/bundle -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) \
            -exec ls -lh {} \; || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskNotes-Timer-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Both matrix jobs race to create the release; ignore "already exists".
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes "See VERSION_HISTORY.md. Builds are unsigned." || true
          # Only one of the dmg/exe globs matches per platform.
          shopt -s nullglob
          gh release upload "$GITHUB_REF_NAME" --clobber \
            src-tauri/target/release/bundle/dmg/*.dmg \
            src-tauri/target/release/bundle/nsis/*.exe
