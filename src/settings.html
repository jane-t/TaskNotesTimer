<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TaskNotes Timer — Settings</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="settings.css">
</head>
<body>
<h1>⚙ TaskNotes Timer Settings</h1>

<div class="section">
  <div class="section-title">API Connection</div>
  <div class="field">
    <label>TaskNotes HTTP API Port</label>
    <input type="number" id="apiPort" value="8080" min="1" max="65535">
    <div class="hint">Default: 8080 — set in Obsidian → TaskNotes → Integrations → HTTP API</div>
  </div>
  <div class="field">
    <label>API Auth Token (optional)</label>
    <input type="text" id="apiToken" placeholder="Leave blank if no token set">
  </div>
  <button id="btn-test">Test Connection</button>
  <div id="test-result" style="font-size:11px;margin-top:6px;color:#6b7280;"></div>
</div>

<div class="section">
  <div class="section-title">Appearance</div>

  <div class="field">
    <label>Screen Position</label>
    <select id="position">
      <option value="top-right">Top Right</option>
      <option value="top-left">Top Left</option>
      <option value="top-center">Top Center</option>
      <option value="bottom-right">Bottom Right</option>
      <option value="bottom-left">Bottom Left</option>
    </select>
  </div>

  <div class="field">
    <div class="row">
      <label style="margin:0">Always on Top</label>
      <label class="toggle">
        <input type="checkbox" id="alwaysOnTop" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>
  </div>

  <div class="field">
    <label>Window Opacity: <span id="opacityVal">95%</span></label>
    <input type="range" id="opacity" min="40" max="100" value="95" style="width:100%;accent-color:#00e5a0;">
  </div>
</div>

<div class="section">
  <div class="section-title">Behaviour</div>
  <div class="field">
    <label>Poll Interval (ms)</label>
    <input type="number" id="pollInterval" value="3000" min="1000" max="30000" step="500">
    <div class="hint">How often to check TaskNotes for timer changes (e.g. 3000 = 3 seconds)</div>
  </div>
</div>

<button id="btn-save">Save Settings</button>
<div id="status-msg"></div>

<script src="settings.js"></script>
</body>
</html>
